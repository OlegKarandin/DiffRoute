[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffopt"
version = "0.1.0"
requires-python = ">=3.11"
description = "Differentiable joint routing and regenerator placement for WDM optical networks, using surrogate gradients through Dijkstra."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Oleg Karandin" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "networkx>=3.2",
    "multilayer-optical-network @ git+https://github.com/OlegKarandin/multilayer-optical-network.git@v0.1.1",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[project.urls]
Repository = "https://github.com/OlegKarandin/diffRouting"

[tool.setuptools.packages.find]
where = ["."]
include = ["diffopt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
