<title>Lightpath Trajectory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* ---------------------------------------------------------------------
   * Token system
   * Light palette lives on the bare :root (complete). The media-query
   * block redefines tokens only, for viewers whose OS prefers dark and who
   * have not explicitly chosen a theme. The [data-theme="dark"] block
   * redefines the same tokens again so an explicit in-host toggle wins in
   * either direction. Never write a color literal outside these blocks.
   * ------------------------------------------------------------------- */
  :root {
    /* surfaces */
    --surface: #f4f6f7;
    --panel: #ffffff;
    --panel-2: #eef1f2;
    --ink: #11181d;
    --muted: #59666f;
    --line: #d7dee2;

    /* semantic — the one colour rule (spec 6.1): read RUN.margin_db, never
       hard-code the threshold. These are the only three hues that mean
       "margin status"; --load is a separate hue reserved for traffic/signal
       load so it never gets confused with a health reading. */
    --red: #b23327;
    --orange: #93601a;
    --green: #257a51;
    --load: #2b699e;

    /* type */
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --text-xs: 11px;
    --text-sm: 12.5px;
    --text-base: 14px;
    --text-md: 15px;
    --text-lg: 19px;

    /* spacing + shape */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --radius: 7px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #10161a;
      --panel: #161d22;
      --panel-2: #1c242a;
      --ink: #e7edf0;
      --muted: #8b98a1;
      --line: #262f35;

      --red: #e2685c;
      --orange: #dba455;
      --green: #55c290;
      --load: #6fa8dc;
    }
  }

  :root[data-theme="dark"] {
    --surface: #10161a;
    --panel: #161d22;
    --panel-2: #1c242a;
    --ink: #e7edf0;
    --muted: #8b98a1;
    --line: #262f35;

    --red: #e2685c;
    --orange: #dba455;
    --green: #55c290;
    --load: #6fa8dc;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--surface);
    color: var(--ink);
  }

  .app-root {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: var(--font-sans);
    font-size: var(--text-base);
    line-height: 1.45;
    color: var(--ink);
    background: var(--surface);
  }

  .num { font-variant-numeric: tabular-nums; }

  /* ---- header ---------------------------------------------------------- */
  .app-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-4);
    padding: var(--space-3) var(--space-5);
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: var(--space-2);
    min-width: 0;
  }

  .brand-glyph {
    font-family: var(--font-mono);
    font-size: var(--text-lg);
    color: var(--load);
  }

  .brand h1 {
    margin: 0;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: var(--text-lg);
    letter-spacing: -0.01em;
    text-wrap: balance;
    white-space: nowrap;
  }

  .header-status {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: var(--space-1);
    text-align: right;
    min-width: 0;
  }

  .run-meta {
    margin: 0;
    font-size: var(--text-sm);
    color: var(--muted);
  }

  .self-check-status {
    margin: 0;
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    letter-spacing: 0.02em;
    color: var(--muted);
    padding: 1px var(--space-2);
    border-radius: var(--radius);
  }

  .self-check-status.alert {
    color: var(--red);
    background: color-mix(in srgb, var(--red) 14%, transparent);
    font-weight: 600;
  }

  /* ---- panels ------------------------------------------------------------ */
  #panels {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
    padding: var(--space-4) var(--space-5);
    overflow-y: auto;
  }

  .panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  #map-panel { flex: 2 1 320px; }
  #strip-panel { flex: 1 1 160px; }
  #stats-panel { flex: 1 1 180px; }

  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
    border-bottom: 1px solid var(--line);
  }

  .panel-head h2 {
    margin: 0;
    font-family: var(--font-mono);
    font-size: var(--text-xs);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .panel-body {
    flex: 1;
    min-height: 0;
    overflow-x: auto;
    overflow-y: auto;
    padding: var(--space-4);
  }

  .placeholder-body {
    display: flex;
    align-items: center;
    color: var(--muted);
    font-size: var(--text-sm);
  }

  /* ---- map panel (Task 8) ------------------------------------------- */
  #map-body {
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    width: 100%;
    height: 100%;
    min-height: 0;
  }

  .map-counter {
    flex: 0 0 auto;
    font-family: var(--font-mono);
    font-size: var(--text-sm);
    color: var(--muted);
  }

  .map-svg {
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    min-height: 220px;
  }

  .map-node text {
    font-family: var(--font-mono);
    pointer-events: none;
    user-select: none;
  }

  /* ---- scrubber ---------------------------------------------------------- */
  #scrubber {
    position: sticky;
    bottom: 0;
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-5);
    border-top: 1px solid var(--line);
    background: var(--panel);
  }

  .scrub-btn {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: var(--text-md);
    color: var(--ink);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
  }

  .scrub-btn:hover { background: var(--line); }

  #scrub-range {
    flex: 1 1 auto;
    accent-color: var(--load);
  }

  .scrub-readout {
    flex: 0 0 auto;
    min-width: 15ch;
    text-align: right;
    font-family: var(--font-mono);
    font-size: var(--text-sm);
  }

  .epoch-label strong {
    font-weight: 600;
    color: var(--ink);
  }

  :focus-visible {
    outline: 2px solid var(--load);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<div class="app-root" id="app-root">
  <div class="app-header" role="banner">
    <div class="brand">
      <span class="brand-glyph" aria-hidden="true">&lambda;</span>
      <h1>Lightpath Trajectory</h1>
    </div>
    <div class="header-status">
      <p class="run-meta num" id="run-meta"></p>
      <p class="self-check-status num" id="self-check-status"></p>
    </div>
  </div>

  <main id="panels">
    <section class="panel" id="map-panel" aria-label="Network map">
      <div class="panel-head"><h2>Network</h2></div>
      <div class="panel-body" id="map-body">
        <div class="placeholder-body">Topology map — nodes, edges and regenerator sites render here.</div>
      </div>
    </section>

    <section class="panel" id="strip-panel" aria-label="Physics strip">
      <div class="panel-head"><h2>Physics strip</h2></div>
      <div class="panel-body placeholder-body">Per-lightpath GSNR margin ribbons render here.</div>
    </section>

    <section class="panel" id="stats-panel" aria-label="Training statistics">
      <div class="panel-head"><h2>Training statistics</h2></div>
      <div class="panel-body placeholder-body">Loss and constraint curves render here.</div>
    </section>
  </main>

  <footer id="scrubber">
    <button class="scrub-btn" id="scrub-prev" aria-label="Previous epoch (Left arrow)">&#8249;</button>
    <input type="range" id="scrub-range" min="0" step="1" value="0" aria-label="Epoch scrubber">
    <button class="scrub-btn" id="scrub-next" aria-label="Next epoch (Right arrow)">&#8250;</button>
    <div class="scrub-readout">
      <span class="epoch-label num" id="epoch-label">&mdash;</span>
    </div>
  </footer>
</div>

<script id="frames" type="application/json">__FRAMES_JSON__</script>
<script>
  const DOC = JSON.parse(document.getElementById('frames').textContent);
  const RUN = DOC.run, TOPO = DOC.topology;
  const DEMAND = new Map(DOC.demands.map(d => [d.id, d]));
  const EPOCHS = DOC.frames.map(f => f.epoch);

  // Keyframe + delta reconstruction, mirroring diffopt/viz/frames.py's
  // replay_frames(). Cached, so scrubbing backwards is not O(n) each time.
  const _cache = new Map();
  function frameAt(epoch) {
    if (_cache.has(epoch)) return _cache.get(epoch);
    let i = DOC.frames.findIndex(f => f.epoch === epoch);
    let start = i;
    while (start > 0 && !DOC.frames[start].keyframe) start--;
    let lps = new Map();
    for (let k = start; k <= i; k++) {
      if (DOC.frames[k].keyframe) lps = new Map();
      for (const lp of DOC.frames[k].lightpaths) lps.set(lp.d, lp);
    }
    const out = { epoch, sites: DOC.frames[i].sites, lightpaths: lps };
    _cache.set(epoch, out);
    return out;
  }

  // The one colour rule (spec 6.1), used by every panel. 0 dB is physics;
  // RUN.margin_db is a buffer against SURROGATE error. Read from the file,
  // never hard-coded.
  function colourOf(marginDb) {
    if (marginDb < 0) return 'red';
    if (marginDb < RUN.margin_db) return 'orange';
    return 'green';
  }

  // Self-check on load: the worst chunk recomputed from seg_gsnr_db + cut_idx
  // must equal the dumped gsnr_db. A mismatch means the DP fold and the
  // deployed rollout disagree, which is worth shouting about (spec 6.7).
  function worstChunkDb(segs, cuts) {
    const bounds = [0, ...[...cuts].sort((a,b)=>a-b).map(k => k + 1), segs.length];
    let worst = 0;
    for (let i = 0; i < bounds.length - 1; i++) {
      let n = 0;
      for (let j = bounds[i]; j < bounds[i+1]; j++) n += Math.pow(10, -segs[j] / 10);
      worst = Math.max(worst, n);
    }
    return -10 * Math.log10(worst);
  }

  // -------------------------------------------------------------------
  // Map panel (Task 8): SVG network map. Draw order is edges -> ribbons
  // (Task 9 fills #map-ribbons) -> nodes; nodes are always opaque and
  // always drawn last so no ROADM or pip is ever buried under a line.
  // -------------------------------------------------------------------
  const MAP_VB_W = 1000, MAP_VB_H = 700, MAP_PAD = 54;
  const MAP_PLOT_W = MAP_VB_W - 2 * MAP_PAD;
  const MAP_PLOT_H = MAP_VB_H - 2 * MAP_PAD;
  const REGEN_SET = new Set(TOPO.regen_candidates);

  function nodeXY(nodeId) {
    const [ux, uy] = TOPO.layout[nodeId];
    return [MAP_PAD + ux * MAP_PLOT_W, MAP_PAD + uy * MAP_PLOT_H];
  }

  // markScale(): every map dimension derives from num_nodes -- never a
  // constant -- so a 17-node and a 130-node topology both stay legible.
  // Node radius ∝ 1/sqrt(num_nodes) over the unit-box layout (the plot
  // box IS that unit box, mapped into viewBox units); everything else
  // (regen ring, pips, ribbon/casing width for Task 9) derives from it.
  function markScale() {
    const n = Math.max(1, TOPO.num_nodes);
    const unit = Math.min(MAP_PLOT_W, MAP_PLOT_H) / Math.sqrt(n);
    const nodeR = Math.max(3, unit * 0.16);
    const regenR = nodeR * 1.45;
    const pipR = Math.max(1.3, nodeR * 0.30);
    const pipHaloR = pipR * 1.9;
    const pipOrbit = nodeR * 1.55;
    const ribbonW = nodeR * 0.5;               // consumed by Task 9
    const casingW = ribbonW + nodeR * 0.32;    // scales with ribbonW, per spec
    const edgeUnit = Math.max(0.35, nodeR * 0.10);
    const showLabels = TOPO.num_nodes <= 40;   // else: hover only, via <title>
    return { nodeR, regenR, pipR, pipHaloR, pipOrbit, ribbonW, casingW, edgeUnit, showLabels };
  }

  // edgeLoad(frame): how many lightpaths use each edge id, over EVERY
  // lightpath in the frame (frameAt already reconstructed the full set,
  // not just whatever a panel chooses to draw) -- by flattening lp.segs.
  function edgeLoad(frame) {
    const counts = new Float64Array(TOPO.edges.length);
    for (const lp of frame.lightpaths.values()) {
      for (const seg of lp.segs) {
        for (const eid of seg) counts[eid]++;
      }
    }
    return counts;
  }

  // Mean margin per edge -- the continuous channel that keeps evolving
  // after the last red clears. Per-edge WORST margin is banned (a single
  // bad demand would paint a large fraction of the network red); mean is
  // not. NaN for an edge no lightpath touches.
  function edgeMeanMargin(frame) {
    const sums = new Float64Array(TOPO.edges.length);
    const counts = new Float64Array(TOPO.edges.length);
    for (const lp of frame.lightpaths.values()) {
      for (const seg of lp.segs) {
        for (const eid of seg) { sums[eid] += lp.margin_db; counts[eid]++; }
      }
    }
    const means = new Float64Array(TOPO.edges.length);
    for (let i = 0; i < means.length; i++) means[i] = counts[i] ? sums[i] / counts[i] : NaN;
    return means;
  }

  function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderMap() {
    const mapBody = document.getElementById('map-body');
    if (!mapBody) return;
    if (!EPOCHS.length || state.epoch === null) {
      mapBody.innerHTML = '<div class="placeholder-body">no frames in this dump</div>';
      return;
    }
    const frame = frameAt(state.epoch);
    const scale = markScale();
    const loads = edgeLoad(frame);
    const means = edgeMeanMargin(frame);

    // ---- edges: neutral load channel, √-scaled width; idle = hairline.
    let edgesSvg = '';
    for (const e of TOPO.edges) {
      const [x1, y1] = nodeXY(e.src);
      const [x2, y2] = nodeXY(e.dst);
      const load = loads[e.id];
      const w = load > 0 ? scale.edgeUnit * Math.sqrt(load) : scale.edgeUnit * 0.22;
      const mean = means[e.id];
      const stroke = Number.isFinite(mean)
        ? `color-mix(in srgb, var(--load) 55%, var(--${colourOf(mean)}) 45%)`
        : 'var(--line)';
      const tip = Number.isFinite(mean)
        ? `edge ${e.id}: node ${e.src}–${e.dst}, ${load} lightpath${load === 1 ? '' : 's'}, mean margin ${mean.toFixed(2)} dB`
        : `edge ${e.id}: node ${e.src}–${e.dst}, idle`;
      edgesSvg +=
        `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" ` +
        `stroke="${stroke}" stroke-width="${w.toFixed(2)}" stroke-opacity="${load > 0 ? 0.85 : 0.5}" ` +
        `stroke-linecap="round"><title>${escHtml(tip)}</title></line>`;
    }

    // ---- nodes: opaque, drawn last. Ordinary / regen candidate / device
    // site are three independent facts about a node, layered together.
    let nodesSvg = '';
    for (let i = 0; i < TOPO.num_nodes; i++) {
      const [cx, cy] = nodeXY(i);
      const isRegen = REGEN_SET.has(i);
      const site = frame.sites[String(i)];
      const count = site ? site.deployed : 0;
      const r = isRegen ? scale.regenR : scale.nodeR;
      const label = `node ${i}${isRegen ? ' (regen candidate)' : ''}${count ? `, ${count} device${count === 1 ? '' : 's'}` : ''}`;
      // <title> first: some browsers only pick up the hover tooltip when
      // it is the group's first child.
      let g = `<g class="map-node"><title>${escHtml(label)}</title>`;

      if (count > 0) {
        // Device site: a filled disc behind the pips (and behind the
        // node's own opaque circle, drawn next).
        g += `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${(r * 1.35).toFixed(2)}" fill="var(--load)" fill-opacity="0.16"/>`;
      }

      // The node itself: always opaque, so it is never buried by an edge
      // or ribbon. Regen candidates get a larger circle + heavier stroke.
      g +=
        `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${r.toFixed(2)}" fill="var(--surface)" ` +
        `stroke="${isRegen ? 'var(--ink)' : 'var(--muted)'}" ` +
        `stroke-width="${(isRegen ? scale.edgeUnit * 2.4 : scale.edgeUnit * 1.1).toFixed(2)}"/>`;

      if (count > 0) {
        if (count > 8) {
          // Degrade honestly: past ~8 devices, swap to a numbered badge
          // for THIS site only -- never a rescale of every mark.
          g += `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${(scale.pipR * 2.2).toFixed(2)}" fill="var(--ink)"/>`;
          g +=
            `<text x="${cx.toFixed(2)}" y="${cy.toFixed(2)}" text-anchor="middle" dominant-baseline="central" ` +
            `font-size="${(scale.pipR * 1.7).toFixed(2)}" fill="var(--surface)">${count}</text>`;
        } else {
          for (let k = 0; k < count; k++) {
            const angle = (2 * Math.PI * k) / count - Math.PI / 2;
            const px = cx + scale.pipOrbit * Math.cos(angle);
            const py = cy + scale.pipOrbit * Math.sin(angle);
            // Faint halo first, so pips stay findable against a busy map.
            g += `<circle cx="${px.toFixed(2)}" cy="${py.toFixed(2)}" r="${scale.pipHaloR.toFixed(2)}" fill="var(--surface)" fill-opacity="0.85" stroke="var(--line)" stroke-width="${(scale.edgeUnit * 0.5).toFixed(2)}"/>`;
            g += `<circle cx="${px.toFixed(2)}" cy="${py.toFixed(2)}" r="${scale.pipR.toFixed(2)}" fill="var(--ink)"/>`;
          }
        }
      }

      if (scale.showLabels) {
        g +=
          `<text x="${cx.toFixed(2)}" y="${(cy - r - 4).toFixed(2)}" text-anchor="middle" ` +
          `font-size="${Math.max(9, Math.min(15, scale.nodeR * 0.55)).toFixed(2)}" fill="var(--muted)">${i}</text>`;
      }
      g += '</g>';
      nodesSvg += g;
    }

    // ---- split counter: wired off colourOf so labels cannot drift from
    // the marks. "showing" == everything NOT green (a future ribbon
    // overlay's subject); the zero state gets words, not blankness.
    let red = 0, orange = 0;
    for (const lp of frame.lightpaths.values()) {
      const c = colourOf(lp.margin_db);
      if (c === 'red') red++;
      else if (c === 'orange') orange++;
    }
    const total = DOC.demands.length;
    const nonGreen = red + orange;
    const counterHtml = nonGreen === 0
      ? `showing <span class="num">0</span> / <span class="num">${total}</span> lightpaths ` +
        `&mdash; every lightpath clears the ${RUN.margin_db.toFixed(1)} dB margin`
      : `showing <span class="num">${nonGreen}</span> / <span class="num">${total}</span> lightpaths &middot; ` +
        `<span class="num" style="color:var(--red)">${red}</span> below threshold &middot; ` +
        `<span class="num" style="color:var(--orange)">${orange}</span> in margin`;

    mapBody.innerHTML =
      `<div class="map-counter" id="map-counter">${counterHtml}</div>` +
      `<svg class="map-svg" viewBox="0 0 ${MAP_VB_W} ${MAP_VB_H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Network map for epoch ${state.epoch}">` +
      `<g id="map-edges">${edgesSvg}</g>` +
      `<g id="map-ribbons"></g>` +
      `<g id="map-nodes">${nodesSvg}</g>` +
      `</svg>`;
  }

  // -------------------------------------------------------------------
  // Shell state + wiring. Later tasks (8-11) extend render(); they must
  // not rename `state`, `render`, or the data-layer symbols above.
  // -------------------------------------------------------------------
  const state = { epoch: EPOCHS.length ? EPOCHS[EPOCHS.length - 1] : null };

  const STORAGE_KEY = 'diffonet-lightpath-viewer:epoch-idx';

  function loadStoredEpochIdx(fallback) {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw === null) return fallback;
      const n = parseInt(raw, 10);
      if (Number.isInteger(n) && n >= 0 && n < EPOCHS.length) return n;
    } catch (e) { /* private mode / blocked storage: ignore */ }
    return fallback;
  }

  function storeEpochIdx(idx) {
    try { localStorage.setItem(STORAGE_KEY, String(idx)); }
    catch (e) { /* private mode / blocked storage: ignore */ }
  }

  const scrubRange = document.getElementById('scrub-range');
  const epochLabel = document.getElementById('epoch-label');
  const runMetaEl = document.getElementById('run-meta');
  const selfCheckEl = document.getElementById('self-check-status');

  function epochIndex(epoch) { return EPOCHS.indexOf(epoch); }

  function setEpochByIndex(idx) {
    if (!EPOCHS.length) return;
    idx = Math.min(EPOCHS.length - 1, Math.max(0, idx));
    state.epoch = EPOCHS[idx];
    scrubRange.value = String(idx);
    storeEpochIdx(idx);
    render();
  }

  function stepEpoch(delta) {
    setEpochByIndex(epochIndex(state.epoch) + delta);
  }

  // render(): this task's stub only updates the scrubber readout. Tasks
  // 8-11 extend this same function to draw the map, strip and stats.
  function render() {
    const idx = epochIndex(state.epoch);
    epochLabel.innerHTML = EPOCHS.length
      ? `epoch <strong>${state.epoch}</strong> &middot; frame ${idx + 1}/${EPOCHS.length}`
      : 'no frames';
    renderMap();
  }

  function initHeader() {
    runMetaEl.textContent = EPOCHS.length
      ? [
          RUN.scenario,
          `${TOPO.num_nodes} nodes`,
          `${DOC.demands.length} demands`,
          `margin ${RUN.margin_db.toFixed(1)} dB`,
        ].join(' · ')
      : 'no frames in this dump';
    if (RUN.config_path) runMetaEl.title = RUN.config_path;
  }

  function runSelfCheck() {
    let checked = 0, mismatches = 0;
    for (const frame of DOC.frames) {
      for (const lp of frame.lightpaths) {
        checked++;
        const recomputed = worstChunkDb(lp.seg_gsnr_db, lp.cut_idx);
        if (!Number.isFinite(recomputed) || Math.abs(recomputed - lp.gsnr_db) > 1e-3) {
          mismatches++;
          console.error(
            `self-check: epoch ${frame.epoch} demand ${lp.d} — recomputed ` +
            `${recomputed} dB vs dumped ${lp.gsnr_db} dB`
          );
        }
      }
    }
    selfCheckEl.classList.toggle('alert', mismatches > 0);
    selfCheckEl.textContent = mismatches > 0
      ? `self-check FAILED: ${mismatches}/${checked} mismatches — see console`
      : `self-check: ${checked} lightpath entries verified`;
  }

  function initScrubber() {
    scrubRange.max = String(Math.max(0, EPOCHS.length - 1));
    const startIdx = EPOCHS.length
      ? loadStoredEpochIdx(EPOCHS.length - 1)
      : 0;
    scrubRange.value = String(startIdx);
    if (EPOCHS.length) state.epoch = EPOCHS[startIdx];

    scrubRange.addEventListener('input', () => setEpochByIndex(+scrubRange.value));
    document.getElementById('scrub-prev').addEventListener('click', () => stepEpoch(-1));
    document.getElementById('scrub-next').addEventListener('click', () => stepEpoch(1));

    // Global arrow-key stepping. Skip while the range input itself has
    // focus: it already steps by one on ArrowLeft/ArrowRight natively and
    // fires its own 'input' event, so handling it here too would double-step.
    document.addEventListener('keydown', (e) => {
      if (e.target === scrubRange) return;
      if (e.key === 'ArrowLeft') { stepEpoch(-1); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { stepEpoch(1); e.preventDefault(); }
    });
  }

  initHeader();
  runSelfCheck();
  initScrubber();
  render();
</script>
