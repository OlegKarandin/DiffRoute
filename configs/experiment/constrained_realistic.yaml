topology: configs/topology/ind_132.json
modulation_formats: configs/modulation_formats.yaml

# Spec §6 step 5: the slack-constraint run. alpha=1.0 puts the big pipes on
# short hops (measured corr(bitrate, km) = -0.829), so the constraint is
# expected to be slack. What this run measures is the regenerator count the
# duals settle on, which should fall below today's 8.

# Ad hoc e2e-pipeline smoke test: small_test.yaml re-pointed at ind_132.json.
# Reuses the existing checkpoints/best_qot.pt (trained on ind_132 via
# base.yaml's 50k/10k run) as qot_checkpoint — QoT training was skipped for
# this run, only the Phase 1c e2e pipeline (routing + regen placement) runs.

# Dataset generation
num_train_samples: 500
num_val_samples: 100
num_demands: 100
bitrate_options: [300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 800]
k_paths: 5
seed: 42

min_regen_reach_km: 250.0
max_regen_reach_km: 3700.0

# WDM
num_channels_cband: 48

# Model
max_spans_per_segment: 60
feature_dim: 5
model_dim: 64
num_heads: 4
num_layers: 2
ff_dim: 128

# Training
epochs: 20
batch_size: 32
learning_rate: 1.0e-3
checkpoint_dir: checkpoints/constrained_realistic
log_dir: logs/constrained_realistic
val_rmse_target: 0.75

# Data
dataset_dir: data/datasets/ind_132

# Phase 1c: end-to-end pipeline
qot_checkpoint: checkpoints/best_qot.pt

pipeline:
  lambda_dev: 0.11         # MEASURED 2026-08-24 by
                           # scripts/calibrate_lambda_dev.py --config
                           # configs/experiment/constrained_stress.yaml.
                           # Measured, not swept and not inherited: the old
                           # lambda_regen 1.0 priced ~1e1 SITES, this prices
                           # ~1e2-1e3 DEVICES, so it is a different problem.
                           #   feasibility push ||dL/dw||_1 = 3.24e+03
                           #                    (at dual_init = 10.0)
                           #   device push      ||dL/dw||_1 = 2.87e+03
                           #                    (at lambda_dev = 1.0)
                           # The two forces are already near parity at unit
                           # lambda, so landing the device push at 10-20% of
                           # feasibility gives the band [0.11, 0.23] — an
                           # order of magnitude BELOW the old value, not
                           # above it.
                           # DECIDED BY check 1, the force-ratio band's lower
                           # edge. Check 2 (flip time) AGREED rather than
                           # overriding: at 0.11 the first device is
                           # recruited at epoch 3 of a 20-epoch trial, inside
                           # its epochs/4 budget, so no below-band override
                           # was needed. Re-run the script if the physics,
                           # the topology or dual_init changes.
  lambda_cost: 0.01
  channel_loading_fraction: 0.5

placement:
  lookahead: true
  # STE: the training forward pass takes the DEPLOYED decision, so the
  # relaxation and hard_rollout cannot disagree about who is feasible. See
  # configs/experiment/constrained_stress.yaml's placement.alloc_ste comment
  # for the measured phantom-violation failure mode this avoids.
  alloc_ste: true

# Fixed traffic matrix. Regenerates deterministically from
# (topology, seed, scale, alpha) — nothing is committed; the checksum is
# pinned in tests/test_traffic.py instead.
traffic:
  scenario: realistic     # "stress" (alpha 0.0) | "realistic" (alpha 1.0)
  seed: 0                 # matrix identity
  scale: 1300000.0        # total offered load in Gbps
  holdout_seed: 1         # a different matrix, for the generalisation gap

# Feasibility as a constraint, not a penalty. `lambda_dev` above stays
# fixed; these duals rise until feasibility is bought, so the device count
# is whatever the constraint requires. Values are reasoned starting
# points, not measured optima — see the design spec §4.
constraint:
  margin_db: 0.5          # delta, added to the bar
  dual_init: 0.0          # lambda_0 — cold start (spec section 3): every
                          # dual starts at 0 under the augmented penalty
  # rho — the augmented penalty coefficient and the dual step —
  # MEASURED 2026-09-06 by
  #   python -m scripts.calibrate_rho --config configs/experiment/constrained_realistic.yaml
  # device push 3.1706e+02, unit (linear, un-relu'd) feasibility push
  # 4.2035e+03 -> lambda* = lambda_dev / s = 0.075429 -> rho = lambda* /
  # 0.35 dB = 0.215511 (ceiling 10*lambda* = 0.754289, not binding).
  # Confirmatory trial (20 epochs, augmented): violated max=0 final=0,
  # last-10 violated max=0 zero_in=10/10, gap min=0 final=0, devices
  # final=0 oracle=0, lambda_max=0.000. This config is designed to stay
  # slack (item #5), which the confirmatory trial's own devices=0 result
  # is consistent with. Re-run the script if the physics, the topology,
  # lambda_dev or margin_db changes.
  # CAVEAT: the calibration ceiling (CEILING_MULTIPLE = 10.0 in
  # scripts/calibrate_rho.py) was derived under Adam and has not been
  # re-derived under SGD — an open caveat, not a blocker.
  rho: 0.215511
  dual_max: 1000.0        # lambda_max — a diagnostic cap, not tuned

training:
  lr_edge_net: 1.0e-3
  # The old lr_regen reasoning — "Adam moves a logit at most lr per epoch, so
  # the total excursion is lr * epochs_e2e" — was about a single free logit
  # per node. The allocation head is an MLP over route-local features, so no
  # such excursion budget applies; this value is inherited, not re-derived.
  # MEASURED under SGD (not the 2.0e-2 the config used to carry, which was
  # calibrated against Adam's normalised step and is ~40x too high for the
  # SGD allocation optimizer). See constrained_stress.yaml's lr_alloc
  # comment for the sweep this value came from.
  lr_alloc: 0.0005         # was lr_regen
  # Grad-norm cap on the allocation head. See constrained_stress.yaml's
  # alloc_grad_clip comment.
  alloc_grad_clip: 100.0
  epochs_e2e: 60
  vlastelica_lambda: 10.0
  vlastelica_lambda_min: 1.0
  vlastelica_lambda_decay: 0.995
  alloc_tau_start: 1.0
  # Pinned to alloc_tau_start, not annealed: under alloc_ste tau has no
  # forward job left (the forward decision is the deployed one), so
  # annealing it only sharpens the backward surrogate and starves every
  # boundary whose score isn't already near 0 — train.py warns if an
  # alloc_ste config leaves these two different. See constrained_stress.yaml's
  # alloc_tau_end comment for the full reasoning.
  alloc_tau_end: 1.0
  alloc_tau_anneal_start_epoch: 10
  alloc_tau_anneal_end_epoch: 55   # inert while tau_start == tau_end
