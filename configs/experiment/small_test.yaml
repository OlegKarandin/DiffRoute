topology: configs/topology/german_17.json
modulation_formats: configs/modulation_formats.yaml

# Dataset generation
num_train_samples: 500
num_val_samples: 100
num_demands: 5
bitrate_options: [300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 800]
k_paths: 5
seed: 42

# Regen-segment target reach, sampled uniformly per segment during dataset
# generation. Measured directly against this file's own bitrate_options via
# real GNPy on a synthetic 80km-span chain: reach ranges ~320km (800 Gbps,
# 15.1dB threshold) to beyond 3600km (300 Gbps, 4.8dB threshold) at full
# (48-channel) loading. Values here are that measured range with margin.
min_regen_reach_km: 250.0
max_regen_reach_km: 3700.0

# WDM
num_channels_cband: 48

# Model
max_spans_per_segment: 60
feature_dim: 5
model_dim: 64
num_heads: 4
num_layers: 2
ff_dim: 128

# Training
epochs: 20
batch_size: 32
learning_rate: 1.0e-3
checkpoint_dir: checkpoints/german_17
log_dir: logs/german_17
# NOTE: re-baselined post-GNPy-migration (Task 8). Measured best val RMSE on
# this config's own real-GNPy-labeled data (500 train / 100 val, 20 epochs):
# 0.6319 dB — did NOT hit the old 0.5 dB target, unlike base.yaml's much
# larger run (see base.yaml's val_rmse_target comment: with only 500 samples
# this config doesn't oversample the segment space the way 50k does, so this
# number is a more honest small-sample generalization check than a
# from-scratch closed-form fit). Target set with headroom above the measured
# value; this config is for fast smoke-testing, not a milestone gate.
val_rmse_target: 0.75

# Data
dataset_dir: data/datasets/german_17

# Phase 1c: end-to-end pipeline
qot_checkpoint: checkpoints/best_qot.pt

pipeline:
  lambda_regen: 1.0
  lambda_infeasible: 10.0
  lambda_cost: 0.01              # demoted to regularizer; ASE-noise STE now dominates routing signal
  channel_loading_fraction: 0.5  # fixed during inference

# NOTE: see base.yaml's segment_combiner comment for the full story — this
# was previously hardcoded at a fixed 0.5, never annealed, which silently
# inverted the "regen helps" invariant. Now annealed alongside regen_tau.
segment_combiner:
  soft_max_temperature: 0.5
  soft_max_temperature_min: 0.01

training:
  lr_edge_net: 1.0e-3  # NOTE: EdgeWeightNet grad norm dropped ~40x after the STE fix (routing-informative gradient replaced a routing-uninformative one) — may need re-tuning for Phase 1d, not yet validated
  # Adam's step is ~lr regardless of gradient magnitude, so a logit moves at
  # most lr_regen per epoch. Crossing p>0.5 from a drifted-down logit needs
  # tens of consecutive correct-sign steps; the old 20 epochs x 1e-2 gave a
  # total excursion of 0.2 and could not place a regenerator even with a
  # correctly-signed gradient. See
  # docs/investigations/regen_placement_not_concentrating.md.
  lr_regen: 2.0e-2
  epochs_e2e: 60
  vlastelica_lambda: 10.0
  vlastelica_lambda_min: 1.0
  vlastelica_lambda_decay: 0.995
  regen_tau_start: 1.0
  regen_tau_end: 0.1
  regen_tau_anneal_start_epoch: 5
  regen_tau_anneal_end_epoch: 18
