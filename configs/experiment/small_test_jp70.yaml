topology: configs/topology/jp_70.json
modulation_formats: configs/modulation_formats.yaml

# Ad hoc e2e-pipeline smoke test: small_test.yaml re-pointed at jp_70.json.
# Reuses the existing checkpoints/best_qot.pt (trained on ind_132 via
# base.yaml's 50k/10k run) as qot_checkpoint — QoT training was skipped for
# this run, only the Phase 1c e2e pipeline (routing + regen placement) runs.
# NOTE: the QoT model was never trained on jp_70's span-length/fiber-type
# distribution, so its GSNR predictions here are an out-of-distribution
# approximation, not a validated fit for this topology.

# Dataset generation
num_train_samples: 500
num_val_samples: 100
num_demands: 5
bitrate_options: [300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 800]
k_paths: 5
seed: 42

min_regen_reach_km: 250.0
max_regen_reach_km: 3700.0

# WDM
num_channels_cband: 48

# Model
max_spans_per_segment: 60
feature_dim: 5
model_dim: 64
num_heads: 4
num_layers: 2
ff_dim: 128

# Training
epochs: 20
batch_size: 32
learning_rate: 1.0e-3
checkpoint_dir: checkpoints/e2e_jp70
log_dir: logs/e2e_jp70
val_rmse_target: 0.75

# Data
dataset_dir: data/datasets/jp_70

# Phase 1c: end-to-end pipeline
qot_checkpoint: checkpoints/best_qot.pt

pipeline:
  lambda_dev: 0.11         # MEASURED 2026-08-24 by
                           # scripts/calibrate_lambda_dev.py --config
                           # configs/experiment/constrained_stress.yaml.
                           # Measured, not swept and not inherited: the old
                           # lambda_regen 1.0 priced ~1e1 SITES, this prices
                           # ~1e2-1e3 DEVICES, so it is a different problem.
                           #   feasibility push ||dL/dw||_1 = 3.24e+03
                           #                    (at dual_init = 10.0)
                           #   device push      ||dL/dw||_1 = 2.87e+03
                           #                    (at lambda_dev = 1.0)
                           # The two forces are already near parity at unit
                           # lambda, so landing the device push at 10-20% of
                           # feasibility gives the band [0.11, 0.23] — an
                           # order of magnitude BELOW the old value, not
                           # above it.
                           # DECIDED BY check 1, the force-ratio band's lower
                           # edge. Check 2 (flip time) AGREED rather than
                           # overriding: at 0.11 the first device is
                           # recruited at epoch 3 of a 20-epoch trial, inside
                           # its epochs/4 budget, so no below-band override
                           # was needed. Re-run the script if the physics,
                           # the topology or dual_init changes.
  lambda_cost: 0.01
  channel_loading_fraction: 0.5

placement:
  lookahead: true

# Fixed traffic matrix. Regenerates deterministically from
# (topology, seed, scale, alpha) — nothing is committed; the checksum is
# pinned in tests/test_traffic.py instead.
traffic:
  scenario: stress        # "stress" (alpha 0.0) | "realistic" (alpha 1.0)
  seed: 0                 # matrix identity
  scale: 500000.0         # total offered load in Gbps
  holdout_seed: 1         # a different matrix, for the generalisation gap

# Feasibility as a constraint, not a penalty. `lambda_dev` above stays
# fixed; these duals rise until feasibility is bought, so the device count
# is whatever the constraint requires. Values are reasoned starting
# points, not measured optima — see the design spec §4.
constraint:
  margin_db: 0.5          # delta, added inside the hinge
  dual_init: 10.0         # lambda_0 — matches the old lambda_infeasible, so
                          # epoch 1 reproduces the previous behaviour
  dual_lr: 1.0            # eta — a 1 dB shortfall moves a dual 10% of lambda_0
  dual_max: 1000.0        # lambda_max — 100x lambda_0; a diagnostic cap

training:
  lr_edge_net: 1.0e-3
  # The old lr_regen reasoning — "Adam moves a logit at most lr per epoch, so
  # the total excursion is lr * epochs_e2e" — was about a single free logit
  # per node. The allocation head is an MLP over route-local features, so no
  # such excursion budget applies; this value is inherited, not re-derived.
  lr_alloc: 2.0e-2         # was lr_regen
  epochs_e2e: 60
  vlastelica_lambda: 10.0
  vlastelica_lambda_min: 1.0
  vlastelica_lambda_decay: 0.995
  alloc_tau_start: 1.0
  # tau_end was 0.1 -- the same value that collapsed training on
  # constrained_stress's 60-epoch run (irreversible float32 sigmoid
  # underflow once scores drift past the tau=0.1 usable band of |s| < 0.5).
  # Floored at 0.3 and the anneal window extended to match, propagating
  # small_test_ind132.yaml's fix (same epochs_e2e, same original 10/40
  # window). See docs/investigations/open_followups.md, "Stage II
  # acceptance run", and
  # .superpowers/sdd/2026-08-24-per-demand-allocation-head/task12-investigation.md
  # (fix B). If epochs_e2e changes again, update this pair rather than
  # leaving it stale relative to it.
  alloc_tau_end: 0.3
  alloc_tau_anneal_start_epoch: 10
  alloc_tau_anneal_end_epoch: 55
