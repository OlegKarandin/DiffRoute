topology: configs/topology/ind_132.json
modulation_formats: configs/modulation_formats.yaml

# NOTE: switched from german_17.json to ind_132.json. german_17's tiny
# segment space (~65,904 possible feature vectors) meant a 50k/10k sample
# draw duplicated ~77% of rows between train and val (see below and
# val_rmse_target's comment) — ind_132 (132 nodes, 168 edges) measures out
# to a ~63x larger pool (~4.1M), reducing that dramatically. Source:
# https://github.com/OlegKarandin/jocn24-multi-fiber.git (Karandin et al.,
# J. Opt. Commun. Netw. 16, H18-H26, 2024); see IND_132.dat's header.

# Dataset generation
num_train_samples: 50000
num_val_samples: 10000
num_demands: 100
bitrate_options: [300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 800]
k_paths: 5
seed: 42

# Regen-segment target reach, sampled uniformly per segment during dataset
# generation. Measured directly against this file's own bitrate_options via
# real GNPy on a synthetic 80km-span chain: reach ranges ~320km (800 Gbps,
# 15.1dB threshold) to beyond 3600km (300 Gbps, 4.8dB threshold) at full
# (48-channel) loading. Values here are that measured range with margin.
# Replaces the prior policy of splitting at 0-2 randomly chosen regen
# candidates regardless of resulting distance, which on ind_132's larger
# diameter (median path passes ~6 regen candidates, vs the live pipeline's
# diffopt/pipeline.py::segment_path splitting at every one of them
# unconditionally) produced segments far longer than realistic regenerator
# spacing would ever allow.
min_regen_reach_km: 250.0
max_regen_reach_km: 3700.0

# WDM
num_channels_cband: 48

# Model
max_spans_per_segment: 60
feature_dim: 5
model_dim: 64
num_heads: 4
num_layers: 2
ff_dim: 128

# Training
epochs: 100
batch_size: 256
learning_rate: 1.0e-3
checkpoint_dir: checkpoints
log_dir: logs
# NOTE: re-measured after switching to ind_132 (see topology note above).
# Best val RMSE over a full 50k-train/10k-val/100-epoch run on real-GNPy-
# labeled ind_132 data: 0.1909 dB (epoch 99; epoch 100 was 0.1909 dB too —
# fully converged, train_mse 0.0335 tracking val closely the whole run, no
# overfitting). This number is a genuinely honest generalization estimate,
# unlike german_17's prior 0.0428 dB: ind_132's much larger segment pool
# (~4.1M vs ~65,904 possible feature vectors) means only ~7.0% of val rows
# have any train duplicate at all (703/10000; was ~77% on german_17), so
# this is measured almost entirely against segments the model hasn't seen
# before, not a lookup-table artifact. Against the dataset's actual GSNR
# range (~6.5-20.0 dB), 0.19 dB is ~1.4% relative error — solid, credible
# accuracy for a differentiable QoT surrogate. Target set with ~30%
# headroom above the measured value (single run, not yet replicated —
# unlike german_17's two-independent-run check, this hasn't been rerun to
# confirm reproducibility).
val_rmse_target: 0.25

# Data
dataset_dir: data/datasets

# Phase 1c: end-to-end pipeline
qot_checkpoint: checkpoints/best_qot.pt

pipeline:
  lambda_dev: 0.11         # MEASURED 2026-08-24 by
                           # scripts/calibrate_lambda_dev.py --config
                           # configs/experiment/constrained_stress.yaml.
                           # Measured, not swept and not inherited: the old
                           # lambda_regen 1.0 priced ~1e1 SITES, this prices
                           # ~1e2-1e3 DEVICES, so it is a different problem.
                           #   feasibility push ||dL/dw||_1 = 3.24e+03
                           #                    (at dual_init = 10.0)
                           #   device push      ||dL/dw||_1 = 2.87e+03
                           #                    (at lambda_dev = 1.0)
                           # The two forces are already near parity at unit
                           # lambda, so landing the device push at 10-20% of
                           # feasibility gives the band [0.11, 0.23] — an
                           # order of magnitude BELOW the old value, not
                           # above it.
                           # DECIDED BY check 1, the force-ratio band's lower
                           # edge. Check 2 (flip time) AGREED rather than
                           # overriding: at 0.11 the first device is
                           # recruited at epoch 3 of a 20-epoch trial, inside
                           # its epochs/4 budget, so no below-band override
                           # was needed. Re-run the script if the physics,
                           # the topology or dual_init changes.
  lambda_cost: 0.01              # demoted to regularizer; ASE-noise STE now dominates routing signal
  channel_loading_fraction: 0.5  # fixed during inference

placement:
  lookahead: true

# Fixed traffic matrix. Regenerates deterministically from
# (topology, seed, scale, alpha) — nothing is committed; the checksum is
# pinned in tests/test_traffic.py instead.
traffic:
  scenario: stress        # "stress" (alpha 0.0) | "realistic" (alpha 1.0)
  seed: 0                 # matrix identity
  scale: 1300000.0        # total offered load in Gbps
  holdout_seed: 1         # a different matrix, for the generalisation gap

# Feasibility as a constraint, not a penalty. `lambda_dev` above stays
# fixed; these duals rise until feasibility is bought, so the device count
# is whatever the constraint requires. Values are reasoned starting
# points, not measured optima — see the design spec §4.
constraint:
  margin_db: 0.5          # delta, added to the bar
  dual_init: 0.0          # lambda_0 — cold start (spec section 3): every
                          # dual starts at 0 under the augmented penalty
  # rho — the augmented penalty coefficient and the dual step. compute_loss
  # requires rho > 0 unconditionally (open_followups.md item #8 removed the
  # hinge penalty, which needed no rho); 0.0 here is a PLACEHOLDER that
  # fails loudly rather than silently. MEASURE it with
  #   python -m scripts.calibrate_rho --config configs/experiment/base.yaml
  # before running this config — see constrained_stress.yaml's rho comment
  # for a worked example (rho: 0.310338 there, measured on that topology).
  rho: 0.0
  dual_max: 1000.0        # lambda_max — a diagnostic cap, not tuned

training:
  lr_edge_net: 1.0e-3  # NOTE: EdgeWeightNet grad norm dropped ~40x after the STE fix (routing-informative gradient replaced a routing-uninformative one) — may need re-tuning for Phase 1d, not yet validated
  # The old lr_regen reasoning — "Adam moves a logit at most lr per epoch, so
  # the total excursion is lr * epochs_e2e" — was about a single free logit
  # per node. The allocation head is an MLP over route-local features, so no
  # such excursion budget applies; this value is inherited, not re-derived.
  lr_alloc: 2.0e-2         # was lr_regen
  epochs_e2e: 500
  vlastelica_lambda: 10.0
  vlastelica_lambda_min: 1.0
  vlastelica_lambda_decay: 0.995
  alloc_tau_start: 1.0
  # tau_end was 0.1 -- the same value that collapsed training on
  # constrained_stress's 60-epoch run (irreversible float32 sigmoid
  # underflow once scores drift past the tau=0.1 usable band of |s| < 0.5).
  # Floored at 0.3, the safety-critical part of that fix: at any point in a
  # linear 1.0->0.3 anneal tau never drops low enough to underflow, whatever
  # epoch the anneal ends on. anneal_end_epoch is deliberately left at 400
  # here (unlike the other four configs, which mirror constrained_stress's
  # validated 40->55 pair exactly) -- this config's 100/400-of-500 window has
  # a different shape and was never run under that pairing. See
  # docs/investigations/open_followups.md, "Stage II acceptance run", and
  # .superpowers/sdd/2026-08-24-per-demand-allocation-head/task12-investigation.md
  # (fix B).
  alloc_tau_end: 0.3
  alloc_tau_anneal_start_epoch: 100
  alloc_tau_anneal_end_epoch: 400
