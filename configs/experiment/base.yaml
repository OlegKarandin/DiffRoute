topology: configs/topology/german_17.json
modulation_formats: configs/modulation_formats.yaml

# Dataset generation
num_train_samples: 50000
num_val_samples: 10000
num_demands: 100
bitrate_options: [300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 800]
k_paths: 5
seed: 42

# WDM
num_channels_cband: 48

# Model
max_spans_per_segment: 60
feature_dim: 5
model_dim: 64
num_heads: 4
num_layers: 2
ff_dim: 128

# Training
epochs: 100
batch_size: 256
learning_rate: 1.0e-3
lr_schedule: cosine
checkpoint_dir: checkpoints
log_dir: logs
# NOTE: re-baselined post-GNPy-migration (Task 8). Measured best val RMSE over
# two independent full 50k-train/10k-val/100-epoch runs on real-GNPy-labeled
# data: 0.0484 dB and 0.0428 dB (reproducible, not a fluke). The old 0.5 dB
# target was met trivially pre-migration because labels were an analytical
# closed-form function of the model's own 5 input features. Real GNPy labels
# are still, per span, a deterministic function of those same 5 features (no
# extra hidden randomness) — and german_17 is small enough, with
# channel_loading_fraction quantized to 48 discrete values, that 50k samples
# oversample a fairly bounded segment space (~77% of train rows share an
# identical feature vector with another row, same for val, with ~63% of
# unique val feature vectors also seen in train) — so this low an RMSE is a
# real property of this (topology, sampling) pair, not a bug, but also not
# proof of generalization to a larger/continuous input space. Target set at
# ~2x the better measured run for headroom against sampling noise.
val_rmse_target: 0.1

# Data
dataset_dir: data/datasets

# Phase 1c: end-to-end pipeline
qot_checkpoint: checkpoints/best_qot.pt

pipeline:
  lambda_regen: 1.0
  lambda_infeasible: 10.0
  lambda_cost: 0.01              # demoted to regularizer; ASE-noise STE now dominates routing signal
  channel_loading_fraction: 0.5  # fixed during inference
  freeze_qot: true

training:
  lr_edge_net: 1.0e-3  # NOTE: EdgeWeightNet grad norm dropped ~40x after the STE fix (routing-informative gradient replaced a routing-uninformative one) — may need re-tuning for Phase 1d, not yet validated
  lr_regen: 1.0e-2
  epochs_e2e: 500
  vlastelica_lambda: 10.0
  vlastelica_lambda_min: 1.0
  vlastelica_lambda_decay: 0.995
  regen_tau_start: 1.0
  regen_tau_end: 0.1
  regen_tau_anneal_start_epoch: 100
  regen_tau_anneal_end_epoch: 400
  checkpoint_interval: 10
