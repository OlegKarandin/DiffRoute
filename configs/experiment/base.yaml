topology: configs/topology/ind_132.json
modulation_formats: configs/modulation_formats.yaml

# NOTE: switched from german_17.json to ind_132.json. german_17's tiny
# segment space (~65,904 possible feature vectors) meant a 50k/10k sample
# draw duplicated ~77% of rows between train and val (see below and
# val_rmse_target's comment) — ind_132 (132 nodes, 168 edges) measures out
# to a ~63x larger pool (~4.1M), reducing that dramatically. Source:
# https://github.com/OlegKarandin/jocn24-multi-fiber.git (Karandin et al.,
# J. Opt. Commun. Netw. 16, H18-H26, 2024); see IND_132.dat's header.

# Dataset generation
num_train_samples: 50000
num_val_samples: 10000
num_demands: 100
bitrate_options: [300, 350, 400, 450, 500, 550, 600, 650, 700, 750, 800]
k_paths: 5
seed: 42

# Regen-segment target reach, sampled uniformly per segment during dataset
# generation. Measured directly against this file's own bitrate_options via
# real GNPy on a synthetic 80km-span chain: reach ranges ~320km (800 Gbps,
# 15.1dB threshold) to beyond 3600km (300 Gbps, 4.8dB threshold) at full
# (48-channel) loading. Values here are that measured range with margin.
# Replaces the prior policy of splitting at 0-2 randomly chosen regen
# candidates regardless of resulting distance, which on ind_132's larger
# diameter (median path passes ~6 regen candidates, vs the live pipeline's
# diffopt/pipeline.py::segment_path splitting at every one of them
# unconditionally) produced segments far longer than realistic regenerator
# spacing would ever allow.
min_regen_reach_km: 250.0
max_regen_reach_km: 3700.0

# WDM
num_channels_cband: 48

# Model
max_spans_per_segment: 60
feature_dim: 5
model_dim: 64
num_heads: 4
num_layers: 2
ff_dim: 128

# Training
epochs: 100
batch_size: 256
learning_rate: 1.0e-3
lr_schedule: cosine
checkpoint_dir: checkpoints
log_dir: logs
# NOTE (STALE — measured on german_17, topology switched to ind_132 above;
# needs re-measurement after the next full retrain, do not trust this
# number or its german_17-specific reasoning below until then):
# re-baselined post-GNPy-migration (Task 8). Measured best val RMSE over
# two independent full 50k-train/10k-val/100-epoch runs on real-GNPy-labeled
# data: 0.0484 dB and 0.0428 dB (reproducible, not a fluke). The old 0.5 dB
# target was met trivially pre-migration because labels were an analytical
# closed-form function of the model's own 5 input features. Real GNPy labels
# are still, per span, a deterministic function of those same 5 features (no
# extra hidden randomness) — and german_17 is small enough, with
# channel_loading_fraction quantized to 48 discrete values, that 50k samples
# oversample a fairly bounded segment space (~77% of train rows share an
# identical feature vector with another row, same for val, with ~63% of
# unique val feature vectors also seen in train) — so this low an RMSE is a
# real property of this (topology, sampling) pair, not a bug, but also not
# proof of generalization to a larger/continuous input space. Target set at
# ~2x the better measured run for headroom against sampling noise.
val_rmse_target: 0.1

# Data
dataset_dir: data/datasets

# Phase 1c: end-to-end pipeline
qot_checkpoint: checkpoints/best_qot.pt

pipeline:
  lambda_regen: 1.0
  lambda_infeasible: 10.0
  lambda_cost: 0.01              # demoted to regularizer; ASE-noise STE now dominates routing signal
  channel_loading_fraction: 0.5  # fixed during inference
  freeze_qot: true

training:
  lr_edge_net: 1.0e-3  # NOTE: EdgeWeightNet grad norm dropped ~40x after the STE fix (routing-informative gradient replaced a routing-uninformative one) — may need re-tuning for Phase 1d, not yet validated
  lr_regen: 1.0e-2
  epochs_e2e: 500
  vlastelica_lambda: 10.0
  vlastelica_lambda_min: 1.0
  vlastelica_lambda_decay: 0.995
  regen_tau_start: 1.0
  regen_tau_end: 0.1
  regen_tau_anneal_start_epoch: 100
  regen_tau_anneal_end_epoch: 400
  checkpoint_interval: 10
